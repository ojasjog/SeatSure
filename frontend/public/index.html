<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EDEFEA" />
    <meta
      name="description"
      content="SeatSure — plan, register and adjust your VIT FFCS timetable."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>SeatSure</title>

    <!--
      Apply the saved day/night theme before React loads, so the page
      never flashes the wrong theme on refresh.
    -->
    <script>
      (function () {
        var theme = "day";
        try {
          var saved = localStorage.getItem("seatsure_theme");
          if (saved === "day" || saved === "night") {
            theme = saved;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "night";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
